name: Daily data update

# These fetch scripts surface *candidate* news via Google News RSS — they
# do not write to Supabase and do not need any secrets. Every fact actually
# published on the site (src/data/*.ts) still goes through manual review:
# see scripts/fetch/*.ts for why (no free keyless API reliably covers
# ~28 countries' electoral commissions, EUR-Lex, or party classification
# databases). Review the candidates artifact below, update src/data/*.ts,
# then run `npx tsx scripts/seed-supabase.ts` and push — that's what
# actually updates the live site.

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  workflow_dispatch: {}

jobs:
  fetch-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Fetch party status candidates
        run: npm run fetch:parties

      - name: Fetch election candidates
        run: npm run fetch:elections

      - name: Fetch legislation candidates
        run: npm run fetch:legislation

      - name: Fetch initiative news candidates
        run: npm run fetch:news

      - name: Upload candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: fetch-candidates-${{ github.run_id }}
          path: scripts/fetch/output/*.json
          retention-days: 14
